name: genkit_openai_custom
description: >-
  Genkit Dart plugin for OpenAI and OpenAI-compatible Chat Completions
  endpoints, plus an OpenCode server bridge powered by opencode_sdk_dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  genkit: ^1.0.0
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.17.0
  schemantic: ^1.0.0
  opencode_sdk_dart:
    path: ../

dev_dependencies:
  build_runner: ^2.10.5
  lints: ^5.0.0
  schemantic_builder: ^1.0.0
  test: ^1.29.0
