name: opencode_chat
description: "A chat client for OpenCode on macOS and the web, built with opencode_sdk_dart."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  effect_core: ^0.0.2
  file_selector: ^1.0.2
  http: ^1.2.0
  opencode_effect:
    path: ../opencode_effect
  opencode_sdk_dart:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
