name: gym_coach
description: "A macOS gym coach that streams workout and nutrition plans from the OpenCode server via Genkit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  effect_core: ^0.0.2
  file_selector: ^1.0.2
  genkit: ^1.0.0
  genkit_opencode_custom:
    path: ../genkit_opencode_custom
  http: ^1.2.0
  marionette_flutter: 0.6.0
  opencode_effect:
    path: ../opencode_effect
  opencode_sdk_dart:
    path: ../
  schemantic: ^1.0.0
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  schemantic_builder: ^1.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
