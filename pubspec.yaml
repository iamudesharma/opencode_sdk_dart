name: opencode_sdk_dart
description: >-
  Cross-platform Dart SDK for the OpenCode V2 HTTP API. Generated from the
  official OpenAPI 3.1 contract with sealed model unions, typed errors,
  multiplexed event streams, plugin RPC, PTY sockets, and local service
  discovery.
version: 0.1.0
repository: https://github.com/anomalyco/opencode
issue_tracker: https://github.com/anomalyco/opencode/issues

environment:
  sdk: ^3.6.0

dependencies:
  http: ^1.2.0
  path: ^1.9.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  image: ^4.2.0
  lints: ^5.0.0
  qr: ^3.0.0
  test: ^1.25.0

topics:
  - opencode
  - api
  - sdk
  - client
