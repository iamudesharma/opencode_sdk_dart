name: opencode_cockpit
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  effect_core: ^0.0.2
  flutter:
    sdk: flutter
  http: ^1.2.0
  opencode_effect:
    path: ../opencode_effect
  opencode_sdk_dart:
    path: ../
  web: ^1.1.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
