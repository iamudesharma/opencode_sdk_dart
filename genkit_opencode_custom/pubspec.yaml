name: genkit_opencode_custom
description: >-
  Genkit Dart plugin for OpenCode: serves models from a local or remote
  OpenCode server through opencode_sdk_dart, with an OpenAI-compatible
  Chat Completions client (openAI()) as a companion handle.
version: 0.2.0
repository: https://github.com/iamudesharma/opencode_sdk_dart
issue_tracker: https://github.com/iamudesharma/opencode_sdk_dart/issues

environment:
  sdk: ^3.13.0

dependencies:
  effect_core: ^0.0.3
  genkit: ^1.0.0
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.17.0
  opencode_effect: ^0.2.0
  opencode_sdk_dart: ^0.2.0
  schemantic: ^1.0.0

dev_dependencies:
  build_runner: ^2.10.5
  lints: ^5.0.0
  schemantic_builder: ^1.0.0
  test: ^1.29.0

topics:
  - opencode
  - genkit
  - ai
  - openai
