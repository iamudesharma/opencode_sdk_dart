name: opencode_effect
description: >-
  Effect-based adapter for opencode_sdk_dart: typed error families,
  interruptible calls, scoped client lifetimes, layers and pull streams built
  on effect_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  effect_core: ^0.0.2
  http: ^1.2.0
  opencode_sdk_dart:
    path: ../

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
